services:
  playwright-bridge:
    build:
      context: ./services/playwright-bridge
      dockerfile: Dockerfile
    container_name: dev-playwright-bridge
    restart: unless-stopped
    networks:
      - internal-net
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - NODE_ENV=production
      - PORT=3000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      - ollama
    ports:
      - "127.0.0.1:3005:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  internal-net:
    external: true