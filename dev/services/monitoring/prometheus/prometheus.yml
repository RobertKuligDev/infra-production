global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']

  - job_name: 'traefik'
    static_configs:
      - targets: ['dev-traefik:8082']

  - job_name: 'temporal-frontend'
    static_configs:
      - targets: ['dev-temporal:8000']

  - job_name: 'postgres'
    static_configs:
      - targets: ['dev-postgres:9187']

  - job_name: 'n8n'
    static_configs:
      - targets: ['dev-n8n:5678']

  - job_name: 'keycloak'
    static_configs:
      - targets: ['dev-keycloak:9000']
