<!--
  ds-radio
  Single radio button with label, helper, and error.
  Works inside any radiogroup.
-->
<label [ngClass]="classes()" role="radio" [attr.aria-checked]="checked()">
  <input
    type="radio"
    class="ds-radio__input"
    [checked]="checked()"
    [disabled]="disabled()"
    (change)="select()"
    (blur)="onTouched()"
    [attr.aria-invalid]="!!error()"
  />

  <span class="ds-radio__circle"></span>

  <span class="ds-radio__label" *ngIf="label()">
    {{ label() }}
  </span>
</label>

<p *ngIf="helper() && !error()" class="ds-radio__helper">
  {{ helper() }}
</p>

<p *ngIf="error()" class="ds-radio__error">
  {{ error() }}
</p>
